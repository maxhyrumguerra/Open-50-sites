<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Open 50 Pages</title>
  <style>
    body {
      background: #0f0f0f;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      height: 100vh;
      align-items: center;
      justify-content: center;
    }
    .box {
      text-align: center;
    }
    input {
      padding: 10px;
      width: 320px;
      font-size: 16px;
      margin-bottom: 12px;
    }
    button {
      padding: 12px 20px;
      font-size: 16px;
      cursor: pointer;
      border: none;
      border-radius: 6px;
      background: #4caf50;
      color: white;
    }
    button:hover {
      background: #43a047;
    }
  </style>
</head>
<body>

<div class="box">
  <h2>Enter a URL ending in a number</h2>
  <input id="urlInput" placeholder="https://example.com/page/1" />
  <br>
  <button onclick="open50()">Open 50 Pages</button>
</div>

<script>
  function open50() {
    const input = document.getElementById("urlInput").value.trim();
    const match = input.match(/(.*?)(\d+)$/);

    if (!match) {
      alert("URL must end with a number (e.g. /1)");
      return;
    }

    const base = match[1];
    const startNum = parseInt(match[2], 10);

    for (let i = 0; i < 50; i++) {
      const url = base + (startNum + i);
      setTimeout(() => {
        window.open(url, "_blank");
      }, i * 200);
    }
  }
</script>

</body>
</html>
