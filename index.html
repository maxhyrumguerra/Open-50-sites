<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Open 50 Sites</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      height: 100vh;
      align-items: center;
      justify-content: center;
      background: #111;
      color: #fff;
    }
    button {
      padding: 16px 24px;
      font-size: 18px;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      background: #4caf50;
      color: #fff;
    }
    button:hover {
      background: #43a047;
    }
  </style>
</head>
<body>

<button onclick="openSites()">Open 50 Sites</button>

<script>
  const urls = [
    "https://example1.com",
    "https://example2.com",
    "https://example3.com"
    // add up to 50 URLs here
  ];

  function openSites() {
    urls.slice(0, 50).forEach((url, index) => {
      setTimeout(() => {
        window.open(url, "_blank");
      }, index * 200); // delay helps avoid popup blocking
    });
  }
</script>

</body>
</html>
